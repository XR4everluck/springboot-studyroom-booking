<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('订单管理 - 管理端')}"></head>
<body>
<nav th:replace="~{fragments/layout :: adminNav('order')}"></nav>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="container">
    <h2 class="page-title">订单管理</h2>

    <form class="filter-bar" method="get" th:action="@{/admin/order}">
        <label>联系人 <input type="text" name="name" th:value="${name}"></label>
        <label>手机号 <input type="text" name="phone" th:value="${phone}"></label>
        <label>状态
            <select name="status">
                <option value="">全部状态</option>
                <option th:each="s : ${T(com.yourname.studyroom.model.enums.BookingStatus).values()}"
                        th:value="${s.code}" th:text="${s.name}"
                        th:selected="${status != null and status.code == s.code}"></option>
            </select>
        </label>
        <button class="btn" type="submit">查询</button>
        <a class="btn" th:href="@{/admin/order}">重置</a>
    </form>

    <table class="table">
        <thead>
        <tr>
            <th>订单号</th><th>联系人</th><th>手机号</th><th>门店/座位</th>
            <th>开始时间</th><th>结束时间</th><th>金额</th><th>状态</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${page.records}">
            <td th:text="${o.orderNo}"></td>
            <td th:text="${o.name}"></td>
            <td th:text="${o.phone}"></td>
            <td th:text="${o.studyStore != null ? o.studyStore.name : ''} + ' / ' + ${o.seat != null ? o.seat.seatCode : ''}"></td>
            <td th:text="${#dates.format(o.startDate, 'MM-dd HH:mm')}"></td>
            <td th:text="${o.endDate != null} ? ${#dates.format(o.endDate, 'MM-dd HH:mm')} : '-'"></td>
            <td th:text="${o.totalAmount}"></td>
            <td><span class="tag"
                      th:classappend="${o.status.code == 1 or o.status.code == 5 or o.status.code == 7} ? 'pending' : (${o.status.code == 2 or o.status.code == 8} ? 'ok' : (${o.status.code == 6} ? 'done' : 'off'))"
                      th:text="${o.status.name}"></span></td>
            <td class="actions">
                <a class="btn small" th:href="@{'/admin/order/' + ${o.id}}">详情</a>
                <form class="inline-form" th:if="${o.status.code} == 1"
                      th:action="@{'/admin/order/status/' + ${o.id}}" method="post">
                    <input type="hidden" name="status" value="2">
                    <button class="btn small primary" type="submit">确认预订</button>
                </form>
                <form class="inline-form" th:if="${o.status.code} == 5"
                      th:action="@{'/admin/order/status/' + ${o.id}}" method="post">
                    <input type="hidden" name="status" value="6">
                    <button class="btn small primary" type="submit">确认签退</button>
                </form>
                <form class="inline-form" th:if="${o.status.code} == 7"
                      th:action="@{'/admin/order/status/' + ${o.id}}" method="post">
                    <input type="hidden" name="status" value="2">
                    <button class="btn small primary" type="submit">确认续期</button>
                </form>
                <form class="inline-form" th:if="${o.status.code} == 2"
                      th:action="@{'/admin/order/checkIn/' + ${o.id}}" method="post">
                    <button class="btn small" type="submit">签到</button>
                </form>
                <form class="inline-form" th:if="${o.status.code} == 8"
                      th:action="@{'/admin/order/checkOut/' + ${o.id}}" method="post">
                    <button class="btn small" type="submit">签退</button>
                </form>
            </td>
        </tr>
        <tr th:if="${page.records.isEmpty()}">
            <td colspan="9" class="empty">
                <div class="empty-icon">📋</div>
                没有符合条件的订单，试试调整筛选条件
            </td>
        </tr>
        </tbody>
    </table>

    <nav th:replace="~{fragments/layout :: pager(${page}, '/admin/order',
        ${'&name=' + (name ?: '') + '&phone=' + (phone ?: '') + (status != null ? '&status=' + status.code : '')})}"></nav>
</div>
</body>
</html>
