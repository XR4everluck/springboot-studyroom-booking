<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('账号编辑 - 管理端')}"></head>
<body>
<nav th:replace="~{fragments/layout :: adminNav('sysuser')}"></nav>

<div class="container narrow">
    <h2 class="page-title" th:text="${systemUser.id} != null ? '编辑账号' : '新增账号'">账号编辑</h2>

    <form th:action="@{/admin/sysuser/save}" method="post" class="form-card">
        <input type="hidden" name="id" th:if="${systemUser.id} != null" th:value="${systemUser.id}">

        <div class="field-row">
            <label class="field">
                <span>登录账号 *</span>
                <input type="text" name="username" required maxlength="20" th:value="${systemUser.username}">
            </label>
            <label class="field">
                <span>姓名 *</span>
                <input type="text" name="name" required maxlength="20" th:value="${systemUser.name}">
            </label>
        </div>

        <div class="field-row">
            <label class="field">
                <span>账号类型</span>
                <select name="type">
                    <option th:each="t : ${T(com.yourname.studyroom.model.enums.SystemUserType).values()}"
                            th:value="${t}" th:text="${t.name}"
                            th:selected="${systemUser.type != null and systemUser.type == t}"></option>
                </select>
            </label>
            <label class="field">
                <span>所属岗位</span>
                <select name="postId">
                    <option value="">未指定</option>
                    <option th:each="p : ${posts}" th:value="${p.id}" th:text="${p.name}"
                            th:selected="${systemUser.postId != null and systemUser.postId == p.id}"></option>
                </select>
            </label>
        </div>

        <div class="field-row">
            <label class="field">
                <span>手机号</span>
                <input type="text" name="phone" maxlength="20" th:value="${systemUser.phone}">
            </label>
            <label class="field">
                <span>账号状态</span>
                <select name="enable">
                    <option value="true" th:selected="${systemUser.id == null or systemUser.status.code == 1}">启用</option>
                    <option value="false" th:selected="${systemUser.id != null and systemUser.status.code == 0}">禁用</option>
                </select>
            </label>
        </div>

        <label class="field">
            <span th:text="${systemUser.id} != null ? '重置密码（留空表示不修改）' : '初始密码 *'">密码</span>
            <input type="password" name="password" maxlength="20" placeholder="8-20位，且同时包含字母和数字">
        </label>

        <div class="form-actions">
            <button type="submit" class="btn primary">保 存</button>
            <a class="btn" th:href="@{/admin/sysuser}">返 回</a>
        </div>
    </form>
</div>
</body>
</html>
