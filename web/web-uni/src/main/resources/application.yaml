server:
  port: 8080
  # 开启响应压缩：管理端/用户端前端入口 JS/CSS 体积较大，压缩后首屏更快
  compression:
    enabled: true
    mime-types: text/html,text/css,text/xml,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024

spring:
  application:
    name: studyroom-uni
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:mysql://127.0.0.1:3306/studyroom_booking?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2b8
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}
    hikari:
      connection-test-query: SELECT 1 # 自动检测连接
      connection-timeout: 60000 #数据库连接超时时间,默认30秒
      idle-timeout: 500000 #空闲连接存活最大时间，默认600000（10分钟）
      max-lifetime: 540000 #此属性控制池中连接的最长生命周期，值0表示无限生命周期，默认1800000（30分钟）
      maximum-pool-size: 12 #连接池最大连接数，默认是10
      minimum-idle: 10 #最小空闲连接数量
      pool-name: UniHikariPool # 连接池名称
  jackson:
    time-zone: GMT+8 # 全局配置时区
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB # 单个上传文件大小上限
      max-request-size: 20MB
  web:
    resources:
      # 静态资源仅取本模块 uni-static（统一入口页 + /console、/h5 两套前端构建产物）、
      # META-INF/resources（knife4j 文档页面）与 common 库的演示图片目录；
      # 不使用默认 classpath:/static/，避免两个业务库 jar 内残留的旧构建产物与源码目录被意外对外提供
      static-locations: classpath:/META-INF/resources/,classpath:/uni-static/,classpath:/static/img/
      cache:
        cachecontrol:
          # 每次使用前先协商（ETag/304），防止前端改版后浏览器按启发式缓存展示旧页面
          no-cache: true

# 用于打印框架生成的sql语句，便于调试
mybatis-plus:
  configuration:
    # 排障期可临时改为 org.apache.ibatis.logging.stdout.StdOutImpl 打印 SQL；
    # 平时保持关闭：该实现会在每个请求内同步写控制台，Windows 控制台下会明显拖慢接口响应。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# 图片等文件存储到本地磁盘，通过 ${url-prefix}/** 对外提供访问（common 模块 LocalStorageConfiguration 注册）
storage:
  upload-dir: ./upload-data
  url-prefix: /upload

# 将queryVo打平处理
springdoc:
  default-flat-param-object: true
